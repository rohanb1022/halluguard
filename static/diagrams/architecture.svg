<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">HalluGuard System Architecture &amp; Workflow</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Claim-Level Hallucination Detection, Multi-Feature Verification &amp; Guarded Answer Generation</text>

  <!-- Box 1: User / Input -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="190" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="95" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1. User / Input</text>
    <text x="95" y="55" text-anchor="middle" font-size="12" fill="#334155">Question +</text>
    <text x="95" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">LLM Answer Text</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="157" x2="275" y2="157" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Preprocessing -->
  <g transform="translate(280, 110)" filter="url(#shadow)">
    <rect width="190" height="95" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.2"/>
    <text x="95" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">2. Preprocessing</text>
    <text x="95" y="55" text-anchor="middle" font-size="12" fill="#334155">Sentence Split &amp;</text>
    <text x="95" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">Claim Extraction</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="470" y1="157" x2="515" y2="157" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Evidence Retrieval -->
  <g transform="translate(520, 110)" filter="url(#shadow)">
    <rect width="200" height="95" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
    <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">3. Evidence Retrieval</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" fill="#047857">TF-IDF Vectorization</text>
    <text x="100" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">&amp; Cosine Similarity</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="157" x2="765" y2="157" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Verification Engine -->
  <g transform="translate(770, 110)" filter="url(#shadow)">
    <rect width="190" height="95" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
    <text x="95" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">4. Verification</text>
    <text x="95" y="50" text-anchor="middle" font-size="11.5" fill="#5b21b6">Numbers · Entities</text>
    <text x="95" y="68" text-anchor="middle" font-size="11.5" fill="#5b21b6">Negation · Coverage</text>
    <text x="95" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">&amp; NLI Cross-Encoder</text>
  </g>

  <!-- Knowledge Base Box (Middle Bottom of Retrieval) -->
  <g transform="translate(520, 260)" filter="url(#shadow)">
    <rect width="200" height="90" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4,3"/>
    <text x="100" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Trusted Knowledge Base</text>
    <text x="100" y="48" text-anchor="middle" font-size="11" fill="#047857">5 Domain Text Files (kb/*.txt)</text>
    <text x="100" y="66" text-anchor="middle" font-size="10.5" fill="#64748b">Transformer · BERT · GPT</text>
    <text x="100" y="80" text-anchor="middle" font-size="10.5" fill="#64748b">AI History · Hallucination Facts</text>
  </g>

  <!-- Two-way Arrow between KB and Retrieval -->
  <line x1="620" y1="260" x2="620" y2="210" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- Arrow from Box 4 Down to Box 5 -->
  <line x1="865" y1="205" x2="865" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Claim Labels -->
  <g transform="translate(770, 260)" filter="url(#shadow)">
    <rect width="190" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
    <text x="95" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">5. Claim Verdicts</text>
    <text x="95" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">● SUPPORTED (Verified)</text>
    <text x="95" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">▲ CONTRADICTED (Intrinsic)</text>
    <text x="95" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">◆ UNSUPPORTED (Extrinsic)</text>
  </g>

  <!-- Arrow from Box 5 to Box 6 (Leftwards) -->
  <line x1="770" y1="410" x2="725" y2="410" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 865 350 L 865 410 L 730 410" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 6: Output -->
  <g transform="translate(520, 375)" filter="url(#shadow)">
    <rect width="200" height="95" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="100" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">6. Guarded Output</text>
    <text x="100" y="48" text-anchor="middle" font-size="11.5" fill="#334155">Guarded Answer + Citations</text>
    <text x="100" y="66" text-anchor="middle" font-size="11" fill="#2563eb">Annotated Highlighting</text>
    <text x="100" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Hallucination Rate &amp; Latency</text>
  </g>

  <!-- Arrow from Box 6 to Box 7 -->
  <line x1="520" y1="422" x2="475" y2="422" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 7: Evaluation -->
  <g transform="translate(280, 375)" filter="url(#shadow)">
    <rect width="190" height="95" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.2"/>
    <text x="95" y="28" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">7. Evaluation &amp; Benchmarks</text>
    <text x="95" y="48" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Precision (81%) · Recall (93%)</text>
    <text x="95" y="66" text-anchor="middle" font-size="11.5" fill="#7f1d1d">F1-Score (0.87) · Accuracy (89.7%)</text>
    <text x="95" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">HaluEval &amp; Confusion Matrix</text>
  </g>

  <!-- Arrow from Box 5 Down to Human Oversight -->
  <path d="M 865 350 L 865 475 L 230 475" fill="none" stroke="#991b1b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Box 8: Human Review -->
  <g transform="translate(40, 425)" filter="url(#shadow)">
    <rect width="190" height="85" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="95" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">Human-in-the-Loop</text>
    <text x="95" y="48" text-anchor="middle" font-size="11" fill="#881337">Review Flagged Claims</text>
    <text x="95" y="66" text-anchor="middle" font-size="10.5" fill="#881337">Responsible AI Governance</text>
  </g>

  <!-- Footer Info -->
  <text x="500" y="538" text-anchor="middle" font-size="11" fill="#94a3b8">HalluGuard PoC | Department of Information Technology | Faculty: Rakhi Jadhav</text>
</svg>

